{% extends "dashboard/base.html" %}

{% block title %}Nueva Variante - Dashboard{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-6">Nueva Variante de Ruta</h1>
    
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="pt-4 flex items-center justify-between">
            <a href="{% url 'dashboard:variant_list' %}" class="text-gray-600 hover:underline">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
