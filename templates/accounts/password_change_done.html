{% extends "base.html" %}
{% block title %}Contraseña Actualizada — La Clásica{% endblock %}
{% block content %}

<div class="bg-navy py-24 px-6 text-center">
  <div class="max-w-3xl mx-auto">
    <div class="inline-block w-16 h-16 bg-crimson/10 flex items-center justify-center rounded-full mb-6 mx-auto">
        <svg class="w-8 h-8 text-crimson" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>
    <h1 class="font-display font-black text-white text-4xl leading-none uppercase mb-4">
      Contraseña Actualizada
    </h1>
    <p class="text-stone-400 max-w-md mx-auto mb-10">
        Tu contraseña ha sido cambiada correctamente. Ahora puedes seguir navegando por La Clásica.
    </p>
    <a href="{% url 'accounts:profile' %}" class="btn-primary inline-block">
        Volver a mi perfil
    </a>
  </div>
</div>

{% endblock %}
